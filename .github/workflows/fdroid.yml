name: F-Droid repo

# Builds a release APK of this fork on every push to master, signs it with the
# fork's own app key, wraps it in a signed F-Droid repo and publishes that repo
# as a tarball on the rolling `fdroid-repo` GitHub release. The deploy job then
# runs on the iemabot server's self-hosted runner (label iemabot-aw-deploy),
# which installs that release with scripts/fdroid/update-server-repo.sh; Caddy
# serves it at FDROID_REPO_URL. Keys live only in the `fdroid` environment
# (master only).

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

env:
  NDK_VERSION: '28.2.13676358'
  JAVA_VERSION: '17'
  APP_ID: net.activitywatch.android
  RELEASE_TAG: fdroid-repo
  FDROID_REPO_URL: https://iemabot.surrey.ac.uk/aw/fdroid/repo
  # Above upstream's committed versionCode, so F-Droid always offers our build
  # as an update; grows with every run of this workflow.
  VERSION_CODE_BASE: '100000'

jobs:
  publish:
    name: Build and publish F-Droid repo
    runs-on: ubuntu-24.04
    environment: fdroid
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Set up Android NDK
      run: |
        sdkmanager "ndk;${{ env.NDK_VERSION }}" "build-tools;35.0.0"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

    - name: Set up Rust
      id: toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Set up Rust toolchain for Android NDK
      run: ./aw-server-rust/install-ndk.sh

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: aw-server-rust/target
        key: cargo-build-target-fdroid-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-build-target-fdroid-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

    - name: Build aw-server-rust (release)
      env:
        RELEASE: 'true'
      run: |
        make aw-server-rust
        python3 scripts/check-jnilibs.py

    # Each ABI carries ~75 MB of (already stripped) Rust libs, so shipping all
    # four made a 280 MB APK. F-Droid picks APKs by ABI; keep FDROID_ABIS only.
    - name: Trim native libs
      env:
        FDROID_ABIS: arm64-v8a
      run: |
        cd mobile/src/main/jniLibs
        for abi in */; do
          abi=${abi%/}
          case " $FDROID_ABIS " in *" $abi "*) ;; *) rm -rf "$abi" ;; esac
        done
        du -ah .

    - name: Set version
      run: |
        VERSION_CODE=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
        SHORT_SHA=${GITHUB_SHA::7}
        sed -i -E "s/^([[:space:]]*versionCode)[[:space:]].*/\1 ${VERSION_CODE}/" mobile/build.gradle
        sed -i -E "s/^([[:space:]]*versionName[[:space:]]+')([^']+)'/\1\2+${SHORT_SHA}'/" mobile/build.gradle
        grep -E "^[[:space:]]*version(Code|Name)" mobile/build.gradle
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: Build release APK
      run: ./gradlew :mobile:assembleStandardRelease -x lintVitalStandardRelease

    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.FDROID_APP_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.FDROID_APP_KEYSTORE_PASSWORD }}
      run: |
        BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
        KS="$RUNNER_TEMP/app.p12"
        printf %s "$KEYSTORE_BASE64" | base64 -d > "$KS"
        mkdir -p fdroid/repo
        OUT="fdroid/repo/${APP_ID}_${VERSION_CODE}.apk"
        "$BT/zipalign" -p 4 mobile/build/outputs/apk/standard/release/mobile-standard-release-unsigned.apk "$OUT"
        "$BT/apksigner" sign --ks "$KS" --ks-key-alias awandroid \
          --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD "$OUT"
        "$BT/apksigner" verify --print-certs "$OUT" | grep SHA-256
        rm -f "$KS" "$OUT.idsig"

    - name: Build F-Droid index
      env:
        KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
      run: |
        pipx install fdroidserver
        cd fdroid
        printf %s "$KEYSTORE_BASE64" | base64 -d > keystore.p12
        mkdir -p metadata/$APP_ID repo/icons
        cp -r ../fastlane/metadata/android/en-US metadata/$APP_ID/en-US
        rm -rf metadata/$APP_ID/en-US/changelogs metadata/$APP_ID/en-US/video.txt
        cp ../fastlane/metadata/android/en-US/images/icon.png repo/icons/aw-fdroid.png
        cat > metadata/$APP_ID.yml <<EOF
        Categories:
          - Time
        License: MPL-2.0
        AuthorName: ActivityWatch (andreifoldes fork)
        WebSite: https://activitywatch.net
        SourceCode: https://github.com/andreifoldes/aw-android
        IssueTracker: https://github.com/andreifoldes/aw-android/issues
        AutoName: ActivityWatch
        EOF
        cat > config.yml <<EOF
        repo_url: $FDROID_REPO_URL
        repo_name: ActivityWatch (iemabot)
        repo_description: >-
          ActivityWatch for Android built from github.com/andreifoldes/aw-android,
          updated with every push to its master branch.
        repo_icon: aw-fdroid.png
        archive_older: 0
        sdk_path: $ANDROID_SDK_ROOT
        keystore: keystore.p12
        repo_keyalias: awfdroidrepo
        keystorepass: {env: FDROID_KEYSTORE_PASSWORD}
        keypass: {env: FDROID_KEYSTORE_PASSWORD}
        EOF
        chmod 600 config.yml keystore.p12
        fdroid update --pretty
        rm -f keystore.p12
        test -s repo/index-v1.jar && test -s repo/entry.jar
        ls -la repo

    - name: Publish to the fdroid-repo release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tar -C fdroid -czf fdroid-repo.tar.gz repo
        sha256sum fdroid-repo.tar.gz | cut -d' ' -f1 > fdroid-repo.sha256
        echo "$VERSION_CODE $GITHUB_SHA" > fdroid-repo.version
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "F-Droid repo" \
            --notes "Signed F-Droid repo bundle, served at $FDROID_REPO_URL. Replaced on every push to master."
        fi
        # Version file last: the server only fetches the bundle once it changes.
        gh release upload "$RELEASE_TAG" fdroid-repo.tar.gz fdroid-repo.sha256 --clobber
        gh release upload "$RELEASE_TAG" fdroid-repo.version --clobber

  deploy:
    name: Deploy to iemabot
    needs: publish
    # The self-hosted runner sits on the production server and this repo is
    # public: it carries only its own label, so no other job can land on it.
    runs-on: iemabot-aw-deploy
    environment: fdroid
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: scripts/fdroid
        sparse-checkout-cone-mode: false

    - name: Install the published repo
      run: |
        DEST=/srv/aw-fdroid sh scripts/fdroid/update-server-repo.sh
        cat /srv/aw-fdroid/current/VERSION

    - name: Check it is served
      run: |
        want=$(cut -d' ' -f1 /srv/aw-fdroid/current/VERSION)
        curl -fsS --max-time 30 "$FDROID_REPO_URL/index-v1.json" |
          python3 -c "import json,sys; d=json.load(sys.stdin); v=[p['versionCode'] for ps in d['packages'].values() for p in ps]; print('served versionCodes:', v); sys.exit(0 if int(sys.argv[1]) in v else 1)" "$want"
